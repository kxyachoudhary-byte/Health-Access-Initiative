name: Southern town geospatial analysis

on:
  push:
    paths:
      - "southern_towns/**"
      - ".github/workflows/test_southern_towns.yml"
  pull_request:
    paths:
      - "southern_towns/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"
      - name: Validate reproducible town analysis
        run: python -m unittest discover -s southern_towns/tests -v
