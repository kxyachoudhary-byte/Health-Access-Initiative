name: Rebuild observed Karnataka healthcare access screening

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "run_observed_karnataka.py"
      - "requirements.txt"
      - ".github/workflows/rebuild_real_data.yml"

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Download cited source releases and compute results
        run: python run_observed_karnataka.py
      - name: Verify source provenance and results
        shell: bash
        run: |
          test -s data/villages_geocoded_karnataka.csv
          test -s data/facilities_phc_chc_karnataka_vicinity.csv
          test -s outputs/run_metadata.json
          test -s outputs/FINDINGS.md
          test -s outputs/candidate_gap_villages.csv
          test -s outputs/candidate_cluster_centers.geojson
          test -s docs/index.html
      - name: Commit observed datasets and derived results
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/villages_geocoded_karnataka.csv data/facilities_phc_chc_karnataka_vicinity.csv outputs/ docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Publish observed-source Karnataka access screening and map'
            git push
          fi
